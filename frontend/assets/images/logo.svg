<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29B6F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Water drop shape -->
  <path d="M100 20 C120 40, 140 70, 140 100 C140 130, 120 150, 100 150 C80 150, 60 130, 60 100 C60 70, 80 40, 100 20 Z" 
        fill="url(#waterGradient)" stroke="#0277BD" stroke-width="2"/>
  
  <!-- Highlight -->
  <ellipse cx="85" cy="60" rx="8" ry="12" fill="#E1F5FE" opacity="0.7"/>
  
  <!-- Company text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277BD">
    WATER STATION
  </text>
</svg>
